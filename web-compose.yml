services:
  travelhub_pro_web:
    build: .
    environment:
      - NODE_ENV=production
      - COOKIE_NAME=user_id
      - COOKIE_MAX_AGE=2592000
    expose:
      - "3000"
    networks:
      - web
    labels:
      caddy: "travelhub_pro.${HOST_SUFFIX:-localhost}"
      caddy.reverse_proxy: "travelhub_pro_web:3000"
